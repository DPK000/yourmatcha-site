<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YourMatcha - Premium Japanese Matcha from Uji, Kyoto</title>
    <meta name="description" content="Single-origin ceremonial matcha, tea and rituals from Uji, Japan. YourMatcha ships across Europe - yourmatcha.nl · yourmatcha.no · yourmatcha.de" />
    <meta name="author" content="YourMatcha" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#3F6B5A" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Fonts: preconnect + directe link i.p.v. @import in CSS (scheelt een request-chain) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9FEF8XXSNV"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-9FEF8XXSNV', { send_page_view: false });
    </script>

    <!--
      Meta Pixel - de PageView bij route changes wordt in de SPA afgevuurd via
      src/hooks/useMetaPixel.ts, net als bij GA4. Daarom hier bewust GEEN
      fbq('track', 'PageView'): dat zou de eerste paginaweergave dubbel tellen.
    -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '2084991389561203');
    </script>

    <!--
      Canonical, hreflang, Open Graph, Twitter en JSON-LD worden per pagina en
      per domein gezet via src/components/SEO.tsx (react-helmet-async).
      Zet hier GEEN statische varianten neer: die gelden dan voor álle domeinen
      (yourmatcha.nl/.no/.de) en conflicteren met de per-pagina tags.
    -->
  </head>

  <body>
    <!-- Meta Pixel fallback zonder JavaScript. Hoort in de body: een <noscript>
         met inhoud is niet toegestaan in <head>. -->
    <noscript><img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=2084991389561203&ev=PageView&noscript=1"
      alt="" /></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
